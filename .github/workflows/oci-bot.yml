name: OCI ARM Host Capacity Bot

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: oci-arm-capacity
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: curl, json, openssl

    - name: Install Dependencies
      run: composer install --no-interaction --prefer-dist

    - name: Create OCI Config and Private Key
      run: |
        mkdir -p ~/.oci

        cat > ~/.oci/config <<EOF
        [DEFAULT]
        user=${{ secrets.OCI_USER_ID }}
        fingerprint=${{ secrets.OCI_FINGERPRINT }}
        tenancy=${{ secrets.OCI_TENANCY_ID }}
        region=${{ secrets.OCI_REGION }}
        key_file=/home/runner/.oci/oci_api_key.pem
        EOF

        cat > /home/runner/.oci/oci_api_key.pem <<'EOF'
        ${{ secrets.OCI_PRIVATE_KEY }}
        EOF

        chmod 600 /home/runner/.oci/oci_api_key.pem

    - name: Run OCI ARM Bot
      env:
        OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
        OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
        OCI_REGION: ${{ secrets.OCI_REGION }}
        OCI_KEY_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
        OCI_PRIVATE_KEY_FILENAME: /home/runner/.oci/oci_api_key.pem

        OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
        OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
        OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}

        OCI_SHAPE: VM.Standard.A1.Flex

        # HUNT TARGET
        OCI_OCPUS: 1
        OCI_MEMORY_IN_GBS: 6

        # RESIZE TARGET
        OCI_RESIZE_OCPUS: 2
        OCI_RESIZE_MEMORY_IN_GBS: 12

        OCI_BOOT_VOLUME_SIZE_IN_GBS: 150

        OCI_AVAILABILITY_DOMAIN: ""
        OCI_MAX_INSTANCES: 1

        OCI_MAX_ATTEMPTS: 3
        OCI_RETRY_DELAY: 40

        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      run: |
        php index.php

    - name: Send Telegram Notification on Success
      if: success()
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        MESSAGE="🎉 *OCI ARM 2/12 BERHASIL!*%0AInstance sudah berhasil di-resize menjadi 2 OCPU / 12 GB RAM."

        curl -s -X POST \
          "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
          -d "chat_id=${TELEGRAM_CHAT_ID}" \
          -d "text=${MESSAGE}" \
          -d "parse_mode=Markdown"

    - name: Disable Workflow Automatically
      if: success()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "2/12 berhasil. Mematikan bot..."
        gh workflow disable oci-bot.yml
